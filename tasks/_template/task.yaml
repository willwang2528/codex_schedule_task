id: replace-me
name: Replace Me

enabled: false

schedule:
  timezone: Asia/Shanghai
  triggers: ["08:00"]
  catch_up_minutes: 60

workflow:
  type: codex_structured

task_prompt:
  path: tasks/_template/TASK.md

delivery:
  type: feishu
  enabled: false
  target: configured_chat
  # Optional hard allowlist; omitted means every schedule trigger may notify.
  # notification_triggers: ["09:00"]
  policy: conditional
  presentation: post
  retry_attempts: 2

execution:
  timeout_seconds: 1200
  retry_attempts: 2
  retry_backoff_seconds: 20

output:
  save_local: true
  directory: outputs/_template

state:
  enabled: true
  path: state/_template.json
  context_recent_items: 25

logging:
  directory: logs/_template
