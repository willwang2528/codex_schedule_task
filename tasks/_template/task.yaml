id: replace-me
name: Replace Me

enabled: false

schedule:
  timezone: Asia/Shanghai
  triggers: ["08:00"]
  catch_up_minutes: 60

workflow:
  type: codex_structured

task_prompt:
  path: tasks/_template/TASK.md

delivery:
  type: feishu
  enabled: false
  target: configured_chat
  # Optional hard allowlist; omitted means every schedule trigger may notify.
  # notification_triggers: ["09:00"]
  # Optional additive Pin archive; every value must also be notification-enabled.
  # daily_archive: {"enabled": true, "trigger_slots": ["15:01"]}
  # Optional deterministic failure alerts; values may include data-only slots.
  # failure_alert: {"enabled": true, "trigger_slots": ["08:00"]}
  # Optional POST/GET verification after send.
  # readback: {"enabled": true, "trigger_slots": ["08:00"], "include_failure_alerts": true, "retry_attempts": 2}
  # Optional completion monitor; slots must be notification-enabled and alerted.
  # completion_monitor: {"enabled": true, "trigger_slots": ["08:00"], "grace_minutes": 10}
  policy: conditional
  presentation: post
  retry_attempts: 2

execution:
  timeout_seconds: 1200
  retry_attempts: 2
  retry_backoff_seconds: 20

output:
  save_local: true
  directory: outputs/_template

state:
  enabled: true
  path: state/_template.json
  context_recent_items: 25
  # Exact Agent-owned state namespaces; Harness fields are always forbidden.
  allowed_update_keys: ["replace_with_domain_namespace"]

logging:
  directory: logs/_template
