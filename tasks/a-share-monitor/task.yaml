id: a-share-monitor
name: A股全时段监盘
enabled: true

schedule:
  timezone: Asia/Shanghai
  triggers: ["09:20", "09:25", "09:35", "09:45", "11:20", "13:15", "14:30", "15:01"]
  calendar:
    weekdays: [1, 2, 3, 4, 5]
    closed_dates: ["2026-01-01", "2026-01-02", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", "2026-02-23", "2026-04-06", "2026-05-01", "2026-05-04", "2026-05-05", "2026-06-19", "2026-09-25", "2026-10-01", "2026-10-02", "2026-10-05", "2026-10-06", "2026-10-07"]
    source_url: https://www.sse.com.cn/disclosure/dealinstruc/closed/
  catch_up_minutes: 20

workflow:
  type: codex_structured
  context_script: tasks/a-share-monitor/collect_market_data.py
  context_timeout_seconds: 90

task_prompt:
  path: tasks/a-share-monitor/TASK.md

execution:
  model: gpt-5.6-terra
  reasoning_effort: high
  timeout_seconds: 1200
  retry_attempts: 2
  retry_backoff_seconds: 20

delivery:
  type: feishu
  enabled: true
  target: configured_chat
  chat_id_env: FEISHU_CHAT_ID_A_SHARE_MONITOR_SCHEDULE_TASK
  notification_triggers: ["09:35", "11:20", "15:01"]
  daily_archive:
    enabled: true
    trigger_slots: ["15:01"]
  failure_alert:
    enabled: true
    trigger_slots: ["09:20", "09:25", "09:35", "09:45", "11:20", "13:15", "14:30", "15:01"]
  readback:
    enabled: true
    trigger_slots: ["09:35", "11:20", "15:01"]
    include_failure_alerts: true
    retry_attempts: 2
  completion_monitor:
    enabled: true
    trigger_slots: ["11:20", "15:01"]
    grace_minutes: 10
  policy: conditional
  presentation: market_dashboard_card
  retry_attempts: 2

output:
  save_local: true
  directory: outputs/a-share-monitor

state:
  enabled: true
  path: state/a-share-monitor.json
  context_recent_items: 30
  track_trigger_slots: true
  allowed_update_keys: ["intraday_state", "completed_trigger_slots_add", "trading_date"]

logging:
  directory: logs/a-share-monitor
